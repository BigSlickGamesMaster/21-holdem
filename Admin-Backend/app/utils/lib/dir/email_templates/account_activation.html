<!DOCTYPE html>
<html>
  <head>
    <title>pokerJack</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style type="text/css">
      table {
        border: 0px;
      }
    </style>
  </head>

  <body style="margin: 0px; padding: 0px">
    <table cellspacing="0" cellpadding="0" width="600" align="center" bgcolor="#fff">
      <tr>
        <td height="5"></td>
      </tr>
      <tr>
        <td>
          <div style="overflow: hidden; display: inline-block">
            <table cellspacing="0" cellpadding="0" width="100%" align="center" style="text-align: left">
              <tr>
                <td>
                  <table cellspacing="0" cellpadding="0" width="100%">
                    <tr>
                      <td>
                        <img style="width: 100%; display: block" src="https://pokerjack-assets.s3.ap-south-1.amazonaws.com/banner.jpg" alt="banner" />
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td bgcolor="#ffffff">
                  <table cellspacing="0" cellpadding="0" width="100%" align="center">
                    <tr>
                      <td>
                        <table cellspacing="0" cellpadding="0" width="94%" align="center">
                          <tr>
                            <td height="50"></td>
                          </tr>
                          <tr>
                            <td>
                              <table cellspacing="0" cellpadding="0" width="95%" align="center">
                                <tr>
                                  <td style="font-family: 'Arial', sans-serif; font-size: 18px; line-height: 20px; color: #000; font-weight: 600">Welcome to poker-jack!,</td>
                                </tr>
                                <tr>
                                  <td height="15"></td>
                                </tr>
                                <tr>
                                  <td style="font-family: 'Lato', sans-serif; font-size: 15px; line-height: 20px; color: #000; font-weight: 600">
                                    Thank you for signing up! You can now play Indian poker-jack games and win prizes! Tap below to get started!.
                                  </td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                          <tr>
                            <td height="30px"></td>
                          </tr>
                          <tr>
                            <td>
                              <a
                                href="<%= sLink %>"
                                style="
                                  padding: 10px;
                                  text-decoration: none;
                                  display: block;
                                  background-color: #d12121;
                                  text-align: center;
                                  font-size: 16px;
                                  line-height: 20px;
                                  color: #fff;
                                  font-family: 'Arial';
                                "
                                >Verify Your Account</a
                              >
                            </td>
                          </tr>
                          <tr>
                            <td height="30px"></td>
                          </tr>
                          <tr>
                            <td>
                              <table cellspacing="0" cellpadding="0" width="95%" align="center">
                                <tr>
                                  <td style="font-family: 'Lato', sans-serif; font-size: 15px; line-height: 20px; color: #000; font-weight: 600">Thanks,</td>
                                </tr>
                                <tr>
                                  <td style="font-family: 'Lato', sans-serif; font-size: 16px; line-height: 28px; color: #000; font-weight: 600">poker-jack</td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                          <tr>
                            <td height="100"></td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td>
                  <div style="padding: 10px; background-color: #2a6382">
                    <img src="https://pokerjack-assets.s3.ap-south-1.amazonaws.com/internet.png" style="margin-right: 10px; display: inline-block; vertical-align: middle" />
                    <a
                      href="www.pokerjack.com"
                      style="font-size: 12px; line-height: 20px; color: #fff; font-family: 'Arial'; text-decoration: none; display: inline-block; vertical-align: middle"
                      >www.pokerjack.com</a
                    >
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
